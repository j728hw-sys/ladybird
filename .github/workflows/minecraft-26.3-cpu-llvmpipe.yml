name: Build Minecraft 26.3 CPU llvmpipe bundle

on:
  workflow_dispatch:
  push:
    branches:
      - mobilegl-windows-build
    paths:
      - ".github/workflows/minecraft-26.3-cpu-llvmpipe.yml"
      - ".github/mesa-cpu/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Mesa3D 26.2.0 MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.0/mesa3d-26.2.0-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          if (-not (Test-Path mesa.7z)) { throw "Mesa archive download failed" }
          Get-Item mesa.7z | Format-List FullName,Length

      - name: Extract Mesa and assemble package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          7z x mesa.7z -omesa -y | Out-Host

          $ogl = Get-ChildItem mesa -Recurse -File -Filter opengl32.dll |
                 Where-Object { $_.FullName -match "\\x64\\" } |
                 Select-Object -First 1
          if (-not $ogl) { throw "x64 opengl32.dll not found" }

          $x64Dir = $ogl.Directory.FullName
          $gallium = Join-Path $x64Dir "libgallium_wgl.dll"
          if (-not (Test-Path $gallium)) { throw "x64 libgallium_wgl.dll not found" }

          New-Item -ItemType Directory -Force package | Out-Null

          foreach ($name in @("opengl32.dll","opengl32sw.dll","libgallium_wgl.dll","libglapi.dll")) {
            $src = Join-Path $x64Dir $name
            if (Test-Path $src) {
              Copy-Item $src package\$name -Force
            }
          }

          Copy-Item .github\mesa-cpu\START_MINECRAFT_26_3_CPU_640x360.cmd package\ -Force
          Copy-Item .github\mesa-cpu\RESTORE_ORIGINAL_OPENGL.cmd package\ -Force
          Copy-Item .github\mesa-cpu\start-cpu-llvmpipe.ps1 package\ -Force
          Copy-Item .github\mesa-cpu\restore-cpu-llvmpipe.ps1 package\ -Force
          Copy-Item .github\mesa-cpu\README_RU.txt package\ -Force

          Get-ChildItem package | Format-Table Name,Length

      - name: Compile CPU renderer verification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found" }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vs) { throw "Visual Studio C++ toolchain not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          $cmd = 'call "' + $vcvars + '" && cl /nologo /EHsc ".github\mesa-cpu\verify-cpu.cpp" user32.lib gdi32.lib opengl32.lib /Fe:"package\verify-cpu.exe"'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "verify-cpu compilation failed" }

      - name: Verify renderer is llvmpipe CPU
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location package
          try {
            $env:GALLIUM_DRIVER = "llvmpipe"
            $env:LIBGL_ALWAYS_SOFTWARE = "true"
            $env:MESA_LOADER_DRIVER_OVERRIDE = "llvmpipe"
            $env:LP_NUM_THREADS = "4"
            $env:PATH = "$PWD;$env:PATH"
            .\verify-cpu.exe
            if ($LASTEXITCODE -ne 0) { throw "llvmpipe verification failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          Remove-Item package\verify-cpu.exe -Force

      - name: Write SHA256
        shell: pwsh
        run: |
          Get-ChildItem package -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content package\SHA256.txt -Encoding ASCII
          Get-Content package\SHA256.txt

      - name: Upload CPU-only bundle
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-26.3-CPU-llvmpipe-640x360
          path: package/*
          if-no-files-found: error
          retention-days: 7
