name: Build OpenBird ARMv7

on:
  pull_request:
    branches: [master]
    paths:
      - 'OpenBird32/**'
      - '.github/workflows/build-openbird32.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout wrapper branch
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --find ld

      - name: Validate build wrapper
        run: |
          set -euo pipefail
          /bin/bash -n OpenBird32/build.sh
          grep -q '9e0198a1a2295f03fa1e8676e216e22c9c7d380b' OpenBird32/build.sh
          grep -q 'FlappyBird iOS' OpenBird32/build.sh
          grep -q 'translate-arch' OpenBird32/build.sh
          grep -q 'armv7-apple-ios5.0' OpenBird32/build.sh
          test ! -e OpenBird32/build/artifacts/OpenBird-iPhoneOS5.0-armv7.ipa

      - name: Build real OpenBird as ARMv7 IPA
        id: openbird_build
        continue-on-error: true
        run: /bin/bash OpenBird32/build.sh

      - name: Extract concise build diagnostics
        if: always()
        run: |
          set -euo pipefail
          LOG=OpenBird32/build/audit/xcodebuild.log
          ERR=OpenBird32/build/audit/errors.txt
          mkdir -p OpenBird32/build/audit
          if test -f "$LOG"; then
            {
              echo '=== Xcode errors ==='
              grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|The following build commands failed' "$LOG" || true
              echo
              echo '=== Last 160 log lines ==='
              tail -n 160 "$LOG"
            } > "$ERR"
            cat "$ERR"
          else
            echo 'xcodebuild.log was not created' | tee "$ERR"
          fi

      - name: Inspect IPA
        if: steps.openbird_build.outcome == 'success'
        run: |
          set -euo pipefail
          IPA=OpenBird32/build/artifacts/OpenBird-iPhoneOS5.0-armv7.ipa
          test -s "$IPA"
          rm -rf "$RUNNER_TEMP/openbird32-inspect"
          mkdir -p "$RUNNER_TEMP/openbird32-inspect"
          ditto -x -k "$IPA" "$RUNNER_TEMP/openbird32-inspect"
          APP="$RUNNER_TEMP/openbird32-inspect/Payload/OpenBird.app"
          BIN="$APP/OpenBird"
          test -x "$BIN"
          file "$BIN" | grep -q 'arm_v7\|armv7'
          lipo -info "$BIN" | grep -q 'armv7'
          plutil -extract CFBundleIdentifier raw "$APP/Info.plist" | grep -qx 'org.openbird.armv7'
          plutil -extract CFBundleExecutable raw "$APP/Info.plist" | grep -qx 'OpenBird'
          plutil -extract MinimumOSVersion raw "$APP/Info.plist" | grep -qx '5.0'
          test ! -e "$APP/_CodeSignature"
          test ! -e "$APP/embedded.mobileprovision"
          find "$APP" -type f | grep -q '/scripts/GameScene.lua$'
          find "$APP" -type f | grep -q '/scripts/StartScene.lua$'
          shasum -a 256 -c OpenBird32/build/artifacts/SHA256SUMS.txt

      - name: Upload OpenBird IPA and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenBird-iPhoneOS5.0-armv7
          path: |
            OpenBird32/build/artifacts/**
            OpenBird32/build/audit/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail job when build failed
        if: steps.openbird_build.outcome != 'success'
        run: exit 1
